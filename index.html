.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;title id=&quot;globe-title&quot;&gt;University Wi-Fi anonymous identity world map&lt;/title&gt;
      &lt;desc id=&quot;globe-description&quot;&gt;An interactive globe or flat world map comparing eduroam and school-owned non-eduroam Wi-Fi guidance by country. Country color reflects the highest-risk classified instruction observed in reviewed guidance: red for identifying, orange for uncertain or review, yellow for explicit blank, blue for explicit anonymous, and grey for unclassified or missing evidence.&lt;/desc&gt;

  &lt;div class=&quot;globe-legend text-small&quot; aria-label=&quot;Globe color legend&quot;&gt;

    &lt;span class=&quot;legend-key&quot;&gt;&lt;i style=&quot;background:var(--privacy-caution)&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Caution · explicit blank instruction&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i style=&quot;background:var(--privacy-review)&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Needs review · uncertain explicit value&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i style=&quot;background:var(--privacy-identifying)&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Higher risk · identifying instruction&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i style=&quot;background:var(--privacy-unknown)&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;No classified explicit instruction&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i class=&quot;no-data-key&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;No country dataset&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i class=&quot;no-evidence-key&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;No guide evidence&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i class=&quot;pending-key&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Review in progress&lt;/span&gt;
    &lt;span class=&quot;legend-key&quot;&gt;&lt;i class=&quot;compact-key&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Enlarged compact-area locator&lt;/span&gt;
  &lt;/div&gt;
  &lt;p class=&quot;text-muted text-small interaction-hint&quot;&gt;Country color reflects the highest-risk classified instruction observed (red &amp;gt; orange &amp;gt; yellow &amp;gt; blue). This summarizes reviewed guidance, not measured runtime identity transmission.&lt;/p&gt;

  &lt;p class=&quot;text-muted text-small interaction-hint&quot; id=&quot;map-interaction-hint&quot;&gt;Drag to rotate · scroll to zoom · select a country to bring it to the front&lt;/p&gt;

  &lt;dialog class=&quot;card about-dialog&quot; id=&quot;about-data&quot; aria-labelledby=&quot;about-title&quot;&gt;
    &lt;div class=&quot;dialog-header&quot;&gt;&lt;h3 id=&quot;about-title&quot;&gt;About this data&lt;/h3&gt;&lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; onclick=&quot;this.closest(&#x27;dialog&#x27;).close()&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;
    &lt;h4&gt;Reading the map and country charts&lt;/h4&gt;
    &lt;p&gt;Country color reflects the highest-risk classified instruction observed in the reviewed guidance: red if an identifying instruction is present; otherwise orange for an uncertain explicit value or review case; otherwise yellow for an explicit blank instruction; otherwise blue when an explicit anonymous instruction is found. Grey means no classified explicit instruction. These are documentation signals, not verified runtime identity transmission.&lt;/p&gt;
    &lt;h4&gt;Explicit anonymous value&lt;/h4&gt;&lt;p&gt;The reviewed guidance specifies an anonymous outer identity value, such as anonymous or anonymous@realm, rather than a personal account name. This indicates a privacy-preserving instruction; runtime transmission was not tested.&lt;/p&gt;
&lt;h4&gt;Real identity used&lt;/h4&gt;&lt;p&gt;The reviewed guidance specifies a personal account name or identifying value for the outer/anonymous identity field. This indicates a potentially identifying instruction, not a captured network transmission.&lt;/p&gt;
&lt;h4&gt;Potentially identifying / review&lt;/h4&gt;&lt;p&gt;A value is specified but may identify a person, or its privacy meaning needs further review. It is not counted as a confirmed anonymous value.&lt;/p&gt;
&lt;h4&gt;Explicit blank&lt;/h4&gt;&lt;p&gt;The reviewed guidance explicitly instructs users to leave the outer/anonymous identity field blank. A blank instruction is different from no instruction; client defaults may affect the identity sent.&lt;/p&gt;
&lt;h4&gt;Not publicly specified&lt;/h4&gt;&lt;p&gt;A valid reviewed public guide does not explicitly state an outer/anonymous identity value. This does not mean a blank value is configured or a real identity is transmitted.&lt;/p&gt;
&lt;h4&gt;Profile/app-based or not applicable&lt;/h4&gt;&lt;p&gt;A grouped review category covering setup delegated to a profile/app or a case where the manual identity instruction is not applicable. It does not classify the downloaded profile or establish privacy protection.&lt;/p&gt;
&lt;h4&gt;Unclear&lt;/h4&gt;&lt;p&gt;A valid public guide was reviewed, but its outer/anonymous identity instruction could not be confidently classified. Missing, inaccessible or inconclusive guides are counted separately from the pie.&lt;/p&gt;
    &lt;p&gt;The country pie uses only institutions with a valid reviewed public guide. No valid guide and guide inconclusive are separate coverage results, not identity outcomes. Country colors summarize the highest-risk classified instruction observed: red for identifying, orange for uncertain or review, yellow for explicit blank, and blue for explicit anonymous. Grey means no classified explicit instruction. Unknown, delegated and unspecified cases remain unassessed even in a colored country.&lt;/p&gt;
    &lt;h4&gt;Map symbols&lt;/h4&gt;&lt;p&gt;No country dataset: no collected country sample. No guide evidence: no valid guide in the sampled institutions. Hatching: review in progress. Enlarged circles: small mapped areas made easier to select.&lt;/p&gt;
    &lt;h4&gt;Scope&lt;/h4&gt;&lt;p&gt;The research focuses on university and higher-education Wi-Fi guidance. The non-eduroam view covers university-owned Wi-Fi networks.&lt;/p&gt;

      return &quot;color-mix(in srgb, var(--muted-foreground) 28%, var(--muted))&quot;;
    }
    if (row.realIdentity &gt; 0 || row.credentialInAnonymousIdentity &gt; 0) return &quot;var(--privacy-identifying)&quot;;
    if (row.needsReview &gt; 0 || row.explicitValue &gt; 0) return &quot;var(--privacy-review)&quot;;
    if (row.explicitBlank &gt; 0) return &quot;var(--privacy-caution)&quot;;
    if (row.anonymousValue &gt; 0) return &quot;var(--privacy-protective)&quot;;
    return &quot;var(--privacy-unknown)&quot;;
  }

  function rateLabel(row) {
    return row.guideFound ? `${Math.round(row.anonymousShare * 100)}%` : &quot;No guide evidence&quot;;
  }

  function tooltipText(row) {
    const review = row.reviewComplete ? &quot;Dataset complete&quot; : `${row.completed}/${row.total} reviewed`;
    return `${row.country}\n${modeInfo[activeMode].label}\nExplicit anonymous share: ${rateLabel(row)}\n${review}`;
  }

  function positionTooltip(event) {
    const rect = stage.getBoundingClientRect();
    const left = Math.min(event.clientX - rect.left + 12, rect.width - tooltip.offsetWidth - 8);
    const top = Math.max(8, event.clientY - rect.top - tooltip.offsetHeight - 10);
    tooltip.style.left = `${Math.max(8, left)}px`;
    tooltip.style.top = `${top}px`;
  }

  function showTooltip(event, row) {
    tooltip.textContent = tooltipText(row);
    tooltip.hidden = false;
    positionTooltip(event);
  }

  function hideTooltip() {
    tooltip.hidden = true;
  }

  function renderGlobe() {
    sphere.setAttribute(&quot;d&quot;, path({ type: &quot;Sphere&quot; }));
    graticule.setAttribute(&quot;d&quot;, path(geoGraticule10()));

    for (const entry of shapeEntries) {
      const row = activeByIso.get(entry.iso);
      const countryPath = path(entry.country) || &quot;&quot;;
      entry.shape.setAttribute(&quot;d&quot;, countryPath);
      entry.shape.style.fill = fillFor(row);
      entry.shape.classList.toggle(&quot;has-data&quot;, Boolean(row));
      entry.shape.classList.toggle(&quot;is-selected&quot;, entry.iso === selectedIso);
      entry.shapeTitle.textContent = row
        ? `${row.country}: ${modeInfo[activeMode].label}, ${rateLabel(row)} explicit anonymous share`
        : entry.country.properties.name || entry.iso;
      entry.overlay.setAttribute(&quot;d&quot;, countryPath);
      entry.overlay.style.display = row &amp;&amp; !row.reviewComplete ? &quot;&quot; : &quot;none&quot;;
    }
    for (const entry of compactEntries) {
      const row = activeByIso.get(entry.iso);
      const compactPath = path(entry.geometry) || &quot;&quot;;
      entry.shape.setAttribute(&quot;d&quot;, compactPath);
      entry.shape.style.fill = fillFor(row);
      entry.shape.classList.toggle(&quot;has-data&quot;, Boolean(row));
      entry.shape.classList.toggle(&quot;is-selected&quot;, entry.iso === selectedIso);
      entry.shapeTitle.textContent = row
        ? `${row.country}: ${modeInfo[activeMode].label}, ${rateLabel(row)} explicit anonymous share (enlarged locator)`
        : entry.iso;
      entry.overlay.setAttribute(&quot;d&quot;, compactPath);
      entry.overlay.style.display = row &amp;&amp; !row.reviewComplete ? &quot;&quot; : &quot;none&quot;;
    }
    hideTooltip();
  }

  function buildProjection(view) {
    if (view === &quot;flat&quot;) {
      return geoNaturalEarth1()
        .translate([480, 320])
        .scale(flatInitialScale)
        .precision(0.4);
    }
    return geoOrthographic()
      .translate([480, 320])
      .scale(initialScale)
      .clipAngle(90)
      .precision(0.4)
      .rotate(initialRotation);
  }

  function updateViewControls() {
    const globeButton = root.querySelector(&quot;#view-globe&quot;);
    const flatButton = root.querySelector(&quot;#view-flat&quot;);
    const globeActive = mapView === &quot;globe&quot;;
    globeButton.classList.toggle(&quot;is-selected&quot;, globeActive);
    flatButton.classList.toggle(&quot;is-selected&quot;, !globeActive);
    globeButton.setAttribute(&quot;aria-pressed&quot;, String(globeActive));
    flatButton.setAttribute(&quot;aria-pressed&quot;, String(!globeActive));
    root.querySelector(&quot;#map-interaction-hint&quot;).textContent = globeActive
      ? &quot;Drag to rotate · scroll to zoom · select a country to bring it to the front&quot;
      : &quot;Scroll to zoom · select a country to view details&quot;;
    root.querySelector(&quot;#globe-reset&quot;).textContent = globeActive ? &quot;Reset globe&quot; : &quot;Reset map&quot;;
    svg.style.cursor = globeActive ? &quot;grab&quot; : &quot;default&quot;;
  }

  function setMapView(view) {
    if (view !== &quot;globe&quot; &amp;&amp; view !== &quot;flat&quot;) return;
    mapView = view;
    projection = buildProjection(view);
    path.projection(projection);
    picker.value = &quot;&quot;;
    selectedIso = null;
    if (dialog.open) dialog.close();
    updateViewControls();
    renderGlobe();
  }

  function setMode(mode) {
    activeMode = mode;
    activeByIso = new Map((mapData[mode] || []).map((row) =&gt; [row.iso3, row]));
    root.querySelector(&quot;#mode-description&quot;).textContent = modeInfo[mode].description;
    picker.value = &quot;&quot;;
    selectedIso = null;
    if (dialog.open) dialog.close();
    renderGlobe();
  }

  function zoomGlobe(factor) {
    const lower = mapView === &quot;globe&quot; ? minScale : flatMinScale;
    const upper = mapView === &quot;globe&quot; ? maxScale : flatMaxScale;
    projection.scale(Math.max(lower, Math.min(upper, projection.scale() * factor)));
    renderGlobe();
  }

  const rotateDrag = drag()
    .on(&quot;start&quot;, () =&gt; {
      dragMoved = false;
      hideTooltip();
    })
    .on(&quot;drag&quot;, (event) =&gt; {
      if (mapView !== &quot;globe&quot;) return;
      dragMoved = dragMoved || Math.abs(event.dx) + Math.abs(event.dy) &gt; 0.5;
      const rotation = projection.rotate();
      const sensitivity = 80 / projection.scale();
      projection.rotate([
        rotation[0] + event.dx * sensitivity,
        Math.max(-89, Math.min(89, rotation[1] - event.dy * sensitivity)),
        rotation[2]
      ]);
      renderGlobe();
    })
    .on(&quot;end&quot;, () =&gt; {
      setTimeout(() =&gt; { dragMoved = false; }, 0);
    });
  select(svg).call(rotateDrag);

  svg.addEventListener(&quot;wheel&quot;, (event) =&gt; {
    event.preventDefault();
    zoomGlobe(event.deltaY &lt; 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  root.querySelector(&quot;#globe-zoom-in&quot;).addEventListener(&quot;click&quot;, () =&gt; zoomGlobe(1.25));
  root.querySelector(&quot;#globe-zoom-out&quot;).addEventListener(&quot;click&quot;, () =&gt; zoomGlobe(1 / 1.25));
  root.querySelector(&quot;#globe-reset&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    projection = buildProjection(mapView);
    path.projection(projection);
    picker.value = &quot;&quot;;
    selectedIso = null;
    renderGlobe();
  });

  root.querySelector(&quot;#view-globe&quot;).addEventListener(&quot;click&quot;, () =&gt; setMapView(&quot;globe&quot;));
  root.querySelector(&quot;#view-flat&quot;).addEventListener(&quot;click&quot;, () =&gt; setMapView(&quot;flat&quot;));

  function centerCountry(iso) {
    const country = featureByIso.get(iso);
    const compact = compactLocations[iso];
    if (!country &amp;&amp; !compact) return;
    const [longitude, latitude] = country
      ? geoCentroid(country)
      : compact.coordinates;
    if (mapView === &quot;globe&quot;) {
      projection.rotate([-longitude, -latitude, 0]);
    }
    renderGlobe();
  }

  function polar(cx, cy, radius, angle) {
    return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
  }

  function donutPath(startAngle, endAngle) {
    const cx = 110;
    const cy = 110;
    const outer = 88;
    const inner = 52;
    const safeEnd = Math.min(endAngle, startAngle + Math.PI * 2 - 0.00001);
    const [x1, y1] = polar(cx, cy, outer, startAngle);
    const [x2, y2] = polar(cx, cy, outer, safeEnd);
    const [x3, y3] = polar(cx, cy, inner, safeEnd);
    const [x4, y4] = polar(cx, cy, inner, startAngle);
    const largeArc = safeEnd - startAngle &gt; Math.PI ? 1 : 0;
    return [
      `M ${x1} ${y1}`,
      `A ${outer} ${outer} 0 ${largeArc} 1 ${x2} ${y2}`,
      `L ${x3} ${y3}`,
      `A ${inner} ${inner} 0 ${largeArc} 0 ${x4} ${y4}`,
      &quot;Z&quot;
    ].join(&quot; &quot;);
  }

  function slicesFor(row) {
    if (row.taxonomy !== &quot;indonesia-five-category&quot; &amp;&amp; row.taxonomy !== &quot;malaysia-five-category&quot; &amp;&amp; row.taxonomy !== &quot;thailand-five-category&quot; &amp;&amp; row.taxonomy !== &quot;vietnam-five-category&quot; &amp;&amp; row.taxonomy !== &quot;current-four-category&quot;) return slices;
    return [
      { field: &quot;explicitBlank&quot;, label: &quot;Explicit blank&quot;, color: &quot;var(--privacy-caution)&quot;, description: &quot;Written blank instruction, completed blank example, or disabled alternate identity/privacy. This is guide coding, not a verified empty transmitted identity.&quot; },
      { field: &quot;explicitValue&quot;, label: &quot;Explicit value&quot;, color: &quot;var(--privacy-review)&quot;, description: &quot;A distinct value or rule is explicitly supplied. Its privacy meaning depends on the published value and is not inferred from the label alone.&quot; },
      { field: &quot;realIdentity&quot;, label: &quot;Same as Identity&quot;, color: &quot;var(--privacy-identifying)&quot;, description: &quot;The guide explicitly reuses the normal Identity value for Anonymous Identity.&quot; },
      { field: &quot;notSpecified&quot;, label: &quot;Not mentioned&quot;, color: &quot;var(--privacy-unknown)&quot;, description: &quot;An accessible EAP setup guide was checked and does not instruct an Anonymous Identity value. A field shown without an instruction is merged here. Omission is not a blank instruction.&quot; }
    ].map((item) =&gt; ({ ...item, shortDescription: item.description }));
  }

  function drawPie(row) {
    const denominator = row.profileTotal ?? row.guideFound;
    const countrySlices = slicesFor(row);
    const sliceGroup = root.querySelector(&quot;#pie-slices&quot;);
    const legend = root.querySelector(&quot;#pie-legend&quot;);
    sliceGroup.replaceChildren();
    legend.replaceChildren();
    let angle = -Math.PI / 2;

    for (const item of countrySlices) {
      const value = item.field === &quot;notSpecified&quot;
        ? (row.notSpecified || 0) + (row.fieldShown || 0)
        : row[item.field];
      const share = denominator ? value / denominator : 0;
      if (value &gt; 0) {
        const nextAngle = angle + share * Math.PI * 2;
        const segment = createSvgElement(&quot;path&quot;, {
          class: &quot;pie-slice&quot;,
          d: donutPath(angle, nextAngle),
          fill: item.color
        });
        const segmentTitle = createSvgElement(&quot;title&quot;);
        segmentTitle.textContent = `${item.label}: ${value} (${Math.round(share * 100)}%). ${item.description}`;
        segment.appendChild(segmentTitle);
        sliceGroup.appendChild(segment);
        angle = nextAngle;
      }

      const legendRow = document.createElement(&quot;div&quot;);
      legendRow.className = &quot;pie-legend-row&quot;;
      const swatch = document.createElement(&quot;span&quot;);
      swatch.className = &quot;pie-legend-swatch&quot;;
      swatch.style.background = item.color;
      const label = document.createElement(&quot;span&quot;);
      const info = document.createElement(&quot;details&quot;);
      info.className = &quot;category-info&quot;;
      const infoSummary = document.createElement(&quot;summary&quot;);
      infoSummary.textContent = item.label + &quot; ⓘ&quot;;
      const explanation = document.createElement(&quot;p&quot;);
      explanation.textContent = item.shortDescription;
      info.append(infoSummary, explanation);
      label.appendChild(info);
      const count = document.createElement(&quot;span&quot;);
      count.className = &quot;pie-legend-value&quot;;
      count.textContent = `${value} · ${Math.round(share * 100)}%`;
      legendRow.append(swatch, label, count);
      legend.appendChild(legendRow);
    }

    root.querySelector(&quot;#pie-total&quot;).textContent = denominator;
    root.querySelector(&quot;#pie-unit&quot;).textContent = row.identityUnit || &quot;valid guides&quot;;
    root.querySelector(&quot;#pie-description&quot;).textContent = countrySlices
      .map((item) =&gt; `${item.label}: ${item.field === &quot;notSpecified&quot; ? (row.notSpecified || 0) + (row.fieldShown || 0) : row[item.field]}`)
      .join(&quot;, &quot;);
  }

  function openCountry(iso) {
    const row = activeByIso.get(iso);
    if (!row) return;
    selectedIso = iso;
    picker.value = iso;
    renderGlobe();

    root.querySelector(&quot;#dialog-mode-label&quot;).textContent = `${modeInfo[activeMode].label} review`;
    root.querySelector(&quot;#dialog-country-name&quot;).textContent = row.country;
    const status = root.querySelector(&quot;#dialog-status&quot;);
    status.classList.toggle(&quot;in-progress&quot;, !row.reviewComplete);
    status.textContent = row.iso3 === &quot;IDN&quot;
      ? (activeMode === &quot;schoolWifi&quot; ? &quot;Discovery complete · 611/611 searched · 14 pending&quot; : &quot;Candidate review · 20 included universities · 1 pending&quot;)
      : row.reviewComplete
      ? `Dataset complete · ${row.completed}/${row.total}`
      : `Review in progress · ${row.completed}/${row.total} completed`;

    drawPie(row);
    root.querySelector(&quot;#country-method-note&quot;).textContent = row.methodNote || &quot;The pie includes only institutions with a valid public guide. Missing, inaccessible, or inconclusive guides are reported separately.&quot;;
    root.querySelector(&quot;#summary-safe-share&quot;).textContent = rateLabel(row);
    root.querySelector(&quot;#summary-guide-found&quot;).textContent = `${row.guideFound} / ${row.total}`;
    root.querySelector(&quot;#guide-found-label&quot;).textContent = row.iso3 === &quot;IDN&quot; ? &quot;Universities with EAP guide&quot; : &quot;Guide found&quot;;
    root.querySelector(&quot;#coverage-rate-label&quot;).textContent = row.iso3 === &quot;IDN&quot; &amp;&amp; activeMode === &quot;eduroam&quot; ? &quot;Candidate guide found rate&quot; : &quot;Public guide found rate&quot;;
    root.querySelector(&quot;#summary-guide-missing&quot;).textContent = row.guideNotFound;
    root.querySelector(&quot;#summary-guide-unclear&quot;).textContent = row.guideUnclear;
    root.querySelector(&quot;#summary-app-profiles&quot;).textContent = row.appProfileUniversities || 0;
    root.querySelector(&quot;#summary-easyroam&quot;).textContent = row.easyroamProfiles || 0;
    root.querySelector(&quot;#summary-securew2&quot;).textContent = row.securew2Profiles || 0;
    root.querySelectorAll(&quot;.platform-summary&quot;).forEach((element) =&gt; {
      element.hidden = activeMode !== &quot;eduroam&quot;;
    });
    const coverage = row.total ? row.guideFound / row.total : 0;
    root.querySelector(&quot;#coverage-value&quot;).textContent = `${Math.round(coverage * 100)}%`;
    root.querySelector(&quot;#coverage-fill&quot;).style.width = `${coverage * 100}%`;
    if (!dialog.open) dialog.showModal();
  }

  modeSelect.addEventListener(&quot;change&quot;, () =&gt; setMode(modeSelect.value));
  picker.addEventListener(&quot;change&quot;, () =&gt; {
    if (!picker.value) return;
    centerCountry(picker.value);
    openCountry(picker.value);
  });
  root.querySelector(&quot;#dialog-close&quot;).addEventListener(&quot;click&quot;, () =&gt; dialog.close());
  dialog.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target === dialog) dialog.close();
  });
  dialog.addEventListener(&quot;close&quot;, () =&gt; {
    selectedIso = null;
    renderGlobe();
  });

  updateViewControls();
  setMode(activeMode);
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
