  const ns = &quot;http://www.w3.org/2000/svg&quot;;

  function fillFor(row) {

      entry.shapeTitle.textContent = row

      hideTooltip();
    })
    .on(&quot;drag&quot;, (event) =&gt; {
      dragMoved = dragMoved || Math.abs(event.dx) + Math.abs(event.dy) &gt; 0.5;
      const rotation = projection.rotate();
      const sensitivity = 80 / projection.scale();
      projection.rotate([
        rotation[0] + event.dx * sensitivity,
        Math.max(-89, Math.min(89, rotation[1] - event.dy * sensitivity)),
        rotation[2]
      ]);
      renderGlobe();
    })
    .on(&quot;end&quot;, () =&gt; {
      setTimeout(() =&gt; { dragMoved = false; }, 0);
    });
  select(svg).call(rotateDrag);

  svg.addEventListener(&quot;wheel&quot;, (event) =&gt; {
    event.preventDefault();
    zoomGlobe(event.deltaY &lt; 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  root.querySelector(&quot;#globe-zoom-in&quot;).addEventListener(&quot;click&quot;, () =&gt; zoomGlobe(1.25));
  root.querySelector(&quot;#globe-zoom-out&quot;).addEventListener(&quot;click&quot;, () =&gt; zoomGlobe(1 / 1.25));
  root.querySelector(&quot;#globe-reset&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    projection.scale(initialScale).rotate(initialRotation);
    picker.value = &quot;&quot;;
    selectedIso = null;
    renderGlobe();
  });

  function centerCountry(iso) {
    const country = featureByIso.get(iso);
    const compact = compactLocations[iso];
    if (!country &amp;&amp; !compact) return;
    const [longitude, latitude] = country
      ? geoCentroid(country)
      : compact.coordinates;
    projection.rotate([-longitude, -latitude, 0]);
    renderGlobe();
  }

  function polar(cx, cy, radius, angle) {
    return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
  }

  function donutPath(startAngle, endAngle) {
    const cx = 110;
    const cy = 110;
    const outer = 88;
    const inner = 52;
    const safeEnd = Math.min(endAngle, startAngle + Math.PI * 2 - 0.00001);
    const [x1, y1] = polar(cx, cy, outer, startAngle);
    const [x2, y2] = polar(cx, cy, outer, safeEnd);
    const [x3, y3] = polar(cx, cy, inner, safeEnd);
    const [x4, y4] = polar(cx, cy, inner, startAngle);
    const largeArc = safeEnd - startAngle &gt; Math.PI ? 1 : 0;
    return [
      `M ${x1} ${y1}`,
      `A ${outer} ${outer} 0 ${largeArc} 1 ${x2} ${y2}`,
      `L ${x3} ${y3}`,
      `A ${inner} ${inner} 0 ${largeArc} 0 ${x4} ${y4}`,
      &quot;Z&quot;
    ].join(&quot; &quot;);
  }

  function drawPie(row) {
    const sliceGroup = root.querySelector(&quot;#pie-slices&quot;);
    const legend = root.querySelector(&quot;#pie-legend&quot;);
    sliceGroup.replaceChildren();
    legend.replaceChildren();
    let angle = -Math.PI / 2;

    for (const item of slices) {
      const value = row[item.field];
      const share = row.guideFound ? value / row.guideFound : 0;
      if (value &gt; 0) {
        const nextAngle = angle + share * Math.PI * 2;
        const segment = createSvgElement(&quot;path&quot;, {
          class: &quot;pie-slice&quot;,
          d: donutPath(angle, nextAngle),
          fill: item.color
        });
        const segmentTitle = createSvgElement(&quot;title&quot;);
        segmentTitle.textContent = `${item.label}: ${value} (${Math.round(share * 100)}%)`;
        segment.appendChild(segmentTitle);
        sliceGroup.appendChild(segment);
        angle = nextAngle;
      }

      const legendRow = document.createElement(&quot;div&quot;);
      legendRow.className = &quot;pie-legend-row&quot;;
      const swatch = document.createElement(&quot;span&quot;);
      swatch.className = &quot;pie-legend-swatch&quot;;
      swatch.style.background = item.color;
      const label = document.createElement(&quot;span&quot;);
      label.textContent = item.label;
      const count = document.createElement(&quot;span&quot;);
      count.className = &quot;pie-legend-value&quot;;
      count.textContent = `${value} · ${Math.round(share * 100)}%`;
      legendRow.append(swatch, label, count);
      legend.appendChild(legendRow);
    }

    root.querySelector(&quot;#pie-total&quot;).textContent = row.guideFound;
    root.querySelector(&quot;#pie-description&quot;).textContent = slices
      .map((item) =&gt; `${item.label}: ${row[item.field]}`)
      .join(&quot;, &quot;);
  }

  function openCountry(iso) {
    const row = activeByIso.get(iso);
    if (!row) return;
    selectedIso = iso;
    picker.value = iso;
    renderGlobe();

    root.querySelector(&quot;#dialog-mode-label&quot;).textContent = `${modeInfo[activeMode].label} review`;
    root.querySelector(&quot;#dialog-country-name&quot;).textContent = row.country;
    const status = root.querySelector(&quot;#dialog-status&quot;);
    status.classList.toggle(&quot;in-progress&quot;, !row.reviewComplete);
    status.textContent = row.reviewComplete
      ? `Dataset complete · ${row.completed}/${row.total}`
      : `Review in progress · ${row.completed}/${row.total} completed`;

    drawPie(row);
    root.querySelector(&quot;#summary-safe-share&quot;).textContent = rateLabel(row);
    root.querySelector(&quot;#summary-guide-found&quot;).textContent = `${row.guideFound} / ${row.total}`;
    root.querySelector(&quot;#summary-guide-missing&quot;).textContent = row.guideNotFound;
    root.querySelector(&quot;#summary-guide-unclear&quot;).textContent = row.guideUnclear;
    root.querySelector(&quot;#summary-easyroam&quot;).textContent = row.easyroamProfiles || 0;
    root.querySelector(&quot;#summary-securew2&quot;).textContent = row.securew2Profiles || 0;
    root.querySelectorAll(&quot;.platform-summary&quot;).forEach((element) =&gt; {
      element.hidden = activeMode !== &quot;eduroam&quot;;
    });
    const coverage = row.total ? row.guideFound / row.total : 0;
    root.querySelector(&quot;#coverage-value&quot;).textContent = `${Math.round(coverage * 100)}%`;
    root.querySelector(&quot;#coverage-fill&quot;).style.width = `${coverage * 100}%`;
    if (!dialog.open) dialog.showModal();
  }

  modeSelect.addEventListener(&quot;change&quot;, () =&gt; setMode(modeSelect.value));
  picker.addEventListener(&quot;change&quot;, () =&gt; {
    if (!picker.value) return;
    centerCountry(picker.value);
    openCountry(picker.value);
  });
  root.querySelector(&quot;#dialog-close&quot;).addEventListener(&quot;click&quot;, () =&gt; dialog.close());
  dialog.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.target === dialog) dialog.close();
  });
  dialog.addEventListener(&quot;close&quot;, () =&gt; {
    selectedIso = null;
    renderGlobe();
  });

  setMode(activeMode);
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
